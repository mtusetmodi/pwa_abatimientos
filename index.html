<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abatimiento Completo</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body { margin: 0; padding: 0; background-color: #e9ecef; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; display: flex; justify-content: space-between; padding: 12px 16px; background: #343a40; color: white; align-items: center; z-index: 10; position: relative;}
        header h2 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65vw; }
        #btn-guardar { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 15px;}
        
        #contenedor-lienzo {
            width: 100vw;
            max-width: 500px;
            height: 52vh;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            position: relative;
        }

        #lienzo {
            width: 100%;
            height: 100%;
            background-color: white;
            background-image: url('plantilla_cruz.png');
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }

        .controles { width: 100%; max-width: 500px; display: flex; justify-content: space-around; padding: 8px; background: #fff; }
        .controles button { padding: 10px; font-size: 15px; background: #007bff; color: white; border: none; border-radius: 8px; width: 48%; font-weight: bold;}
        
        .herramientas { width: 100%; max-width: 500px; display: flex; justify-content: space-between; gap: 5px; padding: 6px 10px; background: #f8f9fa; border-top: 1px solid #ddd; }
        .herramientas button { flex: 1; padding: 8px 4px; font-size: 14px; background: #6c757d; color: white; border: none; border-radius: 8px; font-weight: bold; text-align: center;}
        .herramientas button:active { background: #5a6268; }
        
        #btn-eliminar { background: #dc3545; } 
        #btn-eliminar:active { background: #c82333; }

        #modal-opciones { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; justify-content: center; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 70vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; border-bottom: 2px solid #dc3545; padding-bottom: 10px; color: #dc3545; }
        .opcion-lista { padding: 15px; border-bottom: 1px solid #eee; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
        .opcion-info { display: flex; align-items: center; gap: 10px; }

        .elemento-draggable {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            padding: 2px; background: transparent; touch-action: none; cursor: grab;
            border-radius: 6px; border: 2px solid transparent;
        }
        
        .elemento-draggable.selected { border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.5); background: rgba(255, 255, 255, 0.4); z-index: 50;}

        .titulo-conducto { font-weight: bold; font-size: 13px; margin-bottom: 2px; color: #000; text-align: center; }
        .grid-tubos { display: grid; gap: 2px; justify-items: center; }
        
        .tubo-ind { width: 22px; height: 22px; border: 2px solid #2b4c7e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; background: transparent; color: #8b5a2b; }

        .texto-libre { font-size: 15px; font-weight: bold; color: #000; padding: 2px 4px; background: transparent; }
        .texto-libre.cables-totales { color: #000; }
    </style>
</head>
<body>
    <header>
        <h2 id="titulo-app">Cargando...</h2>
        <button id="btn-guardar">GUARDAR</button>
    </header>

    <div id="contenedor-lienzo">
        <div id="lienzo"></div>
    </div>

    <div class="controles">
        <button id="btn-add-conducto">+ Conducto</button>
        <button id="btn-add-texto">+ Texto / Nota</button>
    </div>

    <div class="herramientas">
        <button id="btn-zoom-out">➖ Zoom</button>
        <button id="btn-zoom-in">➕ Zoom</button>
        <button id="btn-rotar-izq">↺ Girar</button>
        <button id="btn-rotar-der">↻ Girar</button>
    </div>
    
    <div class="herramientas">
        <button id="btn-eliminar">🗑️ Eliminar</button>
        <button id="btn-multi">☐ Sel. Múltiple</button>
    </div>

    <div id="modal-opciones">
        <div class="modal-content">
            <h3>Seleccionar Conducto y Formato</h3>
            <div id="lista-conductos"></div>
            <div class="opcion-lista" style="color:#007bff; font-weight:bold;" onclick="abrirPersonalizado()">
                + Crear Personalizado...
            </div>
            <button onclick="cerrarModal()" style="width:100%; padding:15px; margin-top:15px; background:#6c757d; color:white; border:none; border-radius:8px; font-size:16px;">Cancelar</button>
        </div>
    </div>

    <script>
        const urlScript = "https://script.google.com/macros/s/AKfycbzgetL9wcujKF9VIF5VsNPCytAi21s-EeFKPdt-kgpJFIxC7Jb_mku6YRbgE477VOty/exec"; 

        const urlParams = new URLSearchParams(window.location.search);
        let rawArqueta = urlParams.get('arqueta') || "SIN_ID";
        if (rawArqueta.includes(')')) {
            rawArqueta = rawArqueta.split(')').pop();
        }
        const arquetaId = rawArqueta.trim();

        document.getElementById('titulo-app').innerText = "Arqueta: " + arquetaId;

        let estadoLienzo = { id_arqueta: arquetaId, elementos: [] };
        const lienzo = document.getElementById('lienzo');

        let elementosSeleccionados = new Set();
        let modoSeleccionMultiple = false;

        const opcionesPredefinidas = [
            { prisma: 1, diametro: 110, cols: 1, label: "1 ø 110" },
            { prisma: 2, diametro: 110, cols: 2, label: "2 ø 110 (2x1)" },
            { prisma: 4, diametro: 110, cols: 2, label: "4 ø 110 (2x2)" },
            { prisma: 4, diametro: 110, cols: 4, label: "4 ø 110 (4x1 en línea)" },
            { prisma: 6, diametro: 110, cols: 2, label: "6 ø 110 (2 cols x 3 filas)" },
            { prisma: 6, diametro: 110, cols: 3, label: "6 ø 110 (3 cols x 2 filas)" },
            { prisma: 1, diametro: 125, cols: 1, label: "1 ø 125" },
            { prisma: 2, diametro: 125, cols: 2, label: "2 ø 125 (2x1)" },
            { prisma: 4, diametro: 125, cols: 2, label: "4 ø 125 (2x2)" },
            { prisma: 4, diametro: 125, cols: 4, label: "4 ø 125 (4x1 en línea)" },
            { prisma: 6, diametro: 125, cols: 2, label: "6 ø 125 (2 cols x 3 filas)" },
            { prisma: 6, diametro: 125, cols: 3, label: "6 ø 125 (3 cols x 2 filas)" },
            { prisma: 2, diametro: 100, cols: 2, label: "2 ø 100" },
            { prisma: 5, diametro: 200, cols: 2, label: "5 ø 200" }
        ];

        function inicializar() { 
            renderizarListaConductos(); 
            cargarDatosGuardados();
        }

        // Detección exacta del cuadrante según la posición física real en pantalla
        function calcularCaraDOM(el) {
            const rectLienzo = lienzo.getBoundingClientRect();
            const rectEl = el.getBoundingClientRect();

            // Centro del elemento respecto al lienzo
            const centroElX = (rectEl.left + rectEl.width / 2) - rectLienzo.left;
            const centroElY = (rectEl.top + rectEl.height / 2) - rectLienzo.top;

            const w = rectLienzo.width;
            const h = rectLienzo.height;

            const relX = centroElX - (w / 2);
            const relY = centroElY - (h / 2);

            // Comparar distancias relativas desde el centro geométrico de la cruz
            if (Math.abs(relX) > Math.abs(relY)) {
                return relX > 0 ? 'B' : 'D'; // Derecha -> CARA B | Izquierda -> CARA D
            } else {
                return relY < 0 ? 'A' : 'C'; // Arriba -> CARA A | Abajo -> CARA C
            }
        }

        function cargarDatosGuardados() {
            if (arquetaId === "SIN_ID") {
                asegurarCablesTotalesCruz();
                return;
            }

            fetch(`${urlScript}?arqueta=${encodeURIComponent(arquetaId)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.elementos && data.elementos.length > 0) {
                        lienzo.innerHTML = "";
                        data.elementos.forEach(el => {
                            crearElementoEnDOM(el.tipo, el.texto, parseFloat(el.x), parseFloat(el.y), parseInt(el.prisma), el.diametro, parseFloat(el.rotacion), parseFloat(el.escala), parseInt(el.cols));
                        });
                        seleccionarElemento(null);
                    } else {
                        asegurarCablesTotalesCruz();
                    }
                })
                .catch(err => {
                    console.error("Error al cargar datos:", err);
                    asegurarCablesTotalesCruz();
                });
        }

        function seleccionarElemento(el) {
            if (!el) {
                elementosSeleccionados.forEach(e => e.classList.remove('selected'));
                elementosSeleccionados.clear();
                return;
            }

            if (modoSeleccionMultiple) {
                if (elementosSeleccionados.has(el)) {
                    el.classList.remove('selected');
                    elementosSeleccionados.delete(el);
                } else {
                    el.classList.add('selected');
                    elementosSeleccionados.add(el);
                }
            } else {
                elementosSeleccionados.forEach(e => e.classList.remove('selected'));
                elementosSeleccionados.clear();
                el.classList.add('selected');
                elementosSeleccionados.add(el);
            }
        }

        lienzo.addEventListener('click', (e) => {
            if(e.target === lienzo) seleccionarElemento(null);
        });

        const btnMulti = document.getElementById('btn-multi');
        btnMulti.addEventListener('click', () => {
            modoSeleccionMultiple = !modoSeleccionMultiple;
            btnMulti.style.backgroundColor = modoSeleccionMultiple ? '#28a745' : '#6c757d';
            btnMulti.innerText = modoSeleccionMultiple ? '☑️ Sel. Múltiple' : '☐ Sel. Múltiple';
        });

        document.getElementById('btn-eliminar').addEventListener('click', () => {
            elementosSeleccionados.forEach(el => el.remove());
            elementosSeleccionados.clear();
        });

        function cambiarZoomManual(delta) {
            elementosSeleccionados.forEach(el => {
                let x = parseFloat(el.getAttribute('data-x')) || 0;
                let y = parseFloat(el.getAttribute('data-y')) || 0;
                let rot = el.getAttribute('data-rotacion') || 0;
                let scale = parseFloat(el.getAttribute('data-scale')) || 1;

                scale += delta;
                if (scale < 0.4) scale = 0.4;
                if (scale > 3) scale = 3;

                el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                el.setAttribute('data-scale', scale);
            });
        }

        function cambiarRotacionManual(grados) {
            elementosSeleccionados.forEach(el => {
                let x = parseFloat(el.getAttribute('data-x')) || 0;
                let y = parseFloat(el.getAttribute('data-y')) || 0;
                let rot = (parseFloat(el.getAttribute('data-rotacion')) || 0) + grados;
                let scale = parseFloat(el.getAttribute('data-scale')) || 1;

                el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                el.setAttribute('data-rotacion', rot);
            });
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => cambiarZoomManual(0.1));
        document.getElementById('btn-zoom-out').addEventListener('click', () => cambiarZoomManual(-0.1));
        document.getElementById('btn-rotar-izq').addEventListener('click', () => cambiarRotacionManual(-90));
        document.getElementById('btn-rotar-der').addEventListener('click', () => cambiarRotacionManual(90));

        function asegurarCablesTotalesCruz() {
            const rect = lienzo.getBoundingClientRect();
            const w = rect.width || 300;
            const h = rect.height || 300;

            crearElementoEnDOM('cables', '(0,0)', w * 0.42, h * 0.10, 0, 0, 0, 1, 0); // Cara A
            crearElementoEnDOM('cables', '(0,0)', w * 0.72, h * 0.48, 0, 0, 0, 1, 0); // Cara B
            crearElementoEnDOM('cables', '(0,0)', w * 0.42, h * 0.84, 0, 0, 0, 1, 0); // Cara C
            crearElementoEnDOM('cables', '(0,0)', w * 0.12, h * 0.48, 0, 0, 0, 1, 0); // Cara D
            seleccionarElemento(null);
        }

        function renderizarListaConductos() {
            let html = "";
            opcionesPredefinidas.forEach((opc, idx) => {
                html += `<div class="opcion-lista" onclick="seleccionarConductoPorIndice(${idx})">
                            <div class="opcion-info">○ ${opc.label}</div>
                            <span style="font-size:12px; color:#6c757d;">Elegir</span>
                         </div>`;
            });
            document.getElementById('lista-conductos').innerHTML = html;
        }

        document.getElementById('btn-add-conducto').addEventListener('click', () => { document.getElementById('modal-opciones').style.display = 'flex'; });
        function cerrarModal() { document.getElementById('modal-opciones').style.display = 'none'; }

        function seleccionarConductoPorIndice(idx) {
            cerrarModal();
            let opc = opcionesPredefinidas[idx];
            const rect = lienzo.getBoundingClientRect();
            crearElementoEnDOM('conducto', '', rect.width/2 - 25, rect.height/2 - 25, opc.prisma, opc.diametro, 0, 1, opc.cols);
        }

        function abrirPersonalizado() {
            cerrarModal();
            let p = prompt("Nº de Tubos (Prisma):");
            let d = prompt("Diámetro:");
            let c = prompt("Nº de Columnas (ej: 2 o 3):", "2");
            const rect = lienzo.getBoundingClientRect();
            if(p && d) crearElementoEnDOM('conducto', '', rect.width/2 - 25, rect.height/2 - 25, parseInt(p), d, 0, 1, parseInt(c || 2));
        }

        document.getElementById('btn-add-texto').addEventListener('click', () => {
            let texto = prompt("Escribe tu nota:");
            const rect = lienzo.getBoundingClientRect();
            if(texto) crearElementoEnDOM('texto', texto, rect.width/2 - 25, rect.height/2 - 25, 0, 0, 0, 1, 0);
        });

        function renderizarTubosInternos(div, prisma, diametro, cols) {
            prisma = parseInt(prisma);
            cols = parseInt(cols) || (prisma > 3 ? 2 : prisma);

            let filas = Math.ceil(prisma / cols);
            let inner = `<div class="titulo-conducto">${prisma} ø${diametro}</div>`;
            inner += `<div class="grid-tubos" style="grid-template-columns: repeat(${cols}, 1fr);">`;
            
            for (let r = filas - 1; r >= 0; r--) {
                for (let c = 0; c < cols; c++) {
                    let num = r * cols + c + 1;
                    if (num <= prisma) {
                        inner += `<div class="tubo-ind">${num}</div>`;
                    }
                }
            }
            
            inner += `</div>`;
            div.innerHTML = inner;
        }

        function crearElementoEnDOM(tipo, texto, x, y, prisma, diametro, rotacion, escala, cols) {
            const div = document.createElement('div');
            div.className = 'elemento-draggable';
            div.setAttribute('data-x', x);
            div.setAttribute('data-y', y);
            div.setAttribute('data-tipo', tipo);
            div.setAttribute('data-prisma', prisma);
            div.setAttribute('data-diametro', diametro);
            div.setAttribute('data-rotacion', rotacion);
            div.setAttribute('data-scale', escala);
            div.setAttribute('data-cols', cols || 2);

            div.style.transform = `translate(${x}px, ${y}px) rotate(${rotacion}deg) scale(${escala})`;

            div.addEventListener('click', function(e) {
                seleccionarElemento(this);
                e.stopPropagation();
            });

            if(tipo === 'conducto') {
                renderizarTubosInternos(div, prisma, diametro, cols);

                div.addEventListener('dblclick', function(e) {
                    if (!elementosSeleccionados.has(this)) seleccionarElemento(this);
                    cambiarRotacionManual(90);
                });

            } else {
                let cl = tipo === 'cables' ? 'texto-libre cables-totales' : 'texto-libre';
                div.innerHTML = `<div class="${cl}">${texto}</div>`;
                
                div.addEventListener('dblclick', function(e) {
                    let actual = this.innerText;
                    let msg = tipo === 'cables' ? "Actualizar Cables Totales:" : "Editar nota:";
                    let nuevo = prompt(msg, actual);
                    if(nuevo !== null && nuevo.trim() !== "") this.querySelector('.texto-libre').innerText = nuevo;
                });
            }
            lienzo.appendChild(div);
            
            if (!modoSeleccionMultiple) {
                seleccionarElemento(div);
            } else {
                div.classList.add('selected');
                elementosSeleccionados.add(div);
            }
        }

        interact('.elemento-draggable')
            .draggable({
                inertia: true,
                modifiers: [ interact.modifiers.restrictRect({ restriction: 'parent', endOnly: true }) ],
                listeners: {
                    start(event) { 
                        if (!elementosSeleccionados.has(event.target)) seleccionarElemento(event.target); 
                    },
                    move (event) {
                        elementosSeleccionados.forEach(el => {
                            let x = (parseFloat(el.getAttribute('data-x')) || 0) + event.dx;
                            let y = (parseFloat(el.getAttribute('data-y')) || 0) + event.dy;
                            let rot = el.getAttribute('data-rotacion') || 0;
                            let scale = el.getAttribute('data-scale') || 1;
                            
                            el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                            el.setAttribute('data-x', x);
                            el.setAttribute('data-y', y);
                        });
                    }
                }
            })
            .gesturable({
                listeners: {
                    start(event) { 
                        if (!elementosSeleccionados.has(event.target)) seleccionarElemento(event.target); 
                    },
                    move (event) {
                        elementosSeleccionados.forEach(el => {
                            let x = parseFloat(el.getAttribute('data-x')) || 0;
                            let y = parseFloat(el.getAttribute('data-y')) || 0;
                            let rot = el.getAttribute('data-rotacion') || 0;
                            let scale = parseFloat(el.getAttribute('data-scale')) || 1;

                            scale += event.ds;
                            if (scale < 0.4) scale = 0.4;
                            if (scale > 3) scale = 3;

                            el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                            el.setAttribute('data-scale', scale);
                        });
                    }
                }
            });

        document.getElementById('btn-guardar').addEventListener('click', () => {
            estadoLienzo.elementos = [];

            document.querySelectorAll('.elemento-draggable').forEach(el => {
                let posX = parseFloat(el.getAttribute('data-x')) || 0;
                let posY = parseFloat(el.getAttribute('data-y')) || 0;
                
                // Cálculo 100% basado en la posición física real en pantalla del objeto
                let caraCalculada = calcularCaraDOM(el);

                estadoLienzo.elementos.push({
                    tipo: el.getAttribute('data-tipo'),
                    texto: el.innerText.split('\n')[0],
                    prisma: el.getAttribute('data-prisma'),
                    diametro: el.getAttribute('data-diametro'),
                    cols: el.getAttribute('data-cols'),
                    x: posX,
                    y: posY,
                    cara: caraCalculada,
                    rotacion: el.getAttribute('data-rotacion'),
                    escala: el.getAttribute('data-scale')
                });
            });

            let btn = document.getElementById('btn-guardar');
            btn.innerText = "Guardando...";

            fetch(urlScript, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(estadoLienzo)
            }).then(() => {
                alert("¡Abatimiento guardado correctamente!");
                btn.innerText = "GUARDAR";
            }).catch(err => {
                alert("Error de conexión al guardar.");
                btn.innerText = "GUARDAR";
            });
        });

        inicializar();
    </script>
</body>
</html>
