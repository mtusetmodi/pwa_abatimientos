<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abatimiento Completo</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#343a40">

    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body { margin: 0; padding: 0; background-color: #e9ecef; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; display: flex; justify-content: space-between; padding: 12px 16px; background: #343a40; color: white; align-items: center; z-index: 10; position: relative;}
        header h2 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
        #btn-guardar { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 15px;}
        
        #banner-estado {
            width: 100%; max-width: 500px; padding: 6px; text-align: center; font-size: 12px; font-weight: bold;
            display: none; color: white; transition: all 0.3s ease;
        }

        #contenedor-lienzo {
            width: 100vw;
            max-width: 500px;
            height: 48vh;
            max-height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            position: relative;
        }

        #lienzo {
            width: 100%;
            height: 100%;
            background-color: white;
            background-image: url('plantilla_cruz.png');
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }

        .controles { width: 100%; max-width: 500px; display: flex; justify-content: space-around; padding: 6px 8px; background: #fff; }
        .controles button { padding: 9px; font-size: 14px; background: #007bff; color: white; border: none; border-radius: 8px; width: 48%; font-weight: bold;}
        
        .bloque-herramientas {
            width: 100%; max-width: 500px; background: #f8f9fa; border-top: 1px solid #ddd; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px;
        }
        
        .fila-herramientas {
            display: flex; justify-content: space-between; width: 100%; gap: 10px;
        }

        .fila-herramientas button {
            flex: 1; padding: 8px 2px; font-size: 12px; font-weight: bold; border: none; border-radius: 8px; color: white; background: #6c757d; text-align: center;
        }

        .fila-herramientas button:active {
            background: #5a6268;
        }

        #btn-eliminar { background: #dc3545; } 
        #btn-eliminar:active { background: #c82333; }
        
        .seccion-cables {
            width: 100%; max-width: 500px; background: #e9ecef; border-top: 2px solid #ced4da; padding: 6px; display: flex; justify-content: center;
        }
        
        #btn-toggle-cables { 
            width: 100%;
            padding: 10px; 
            font-size: 13px; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            background: #6f42c1;
            text-align: center; 
        }

        #modal-opciones { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; justify-content: center; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 70vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; border-bottom: 2px solid #dc3545; padding-bottom: 10px; color: #dc3545; }
        .opcion-lista { padding: 15px; border-bottom: 1px solid #eee; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }

        .elemento-draggable {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            padding: 2px; background: transparent; touch-action: none; cursor: grab;
            border-radius: 6px; border: 2px solid transparent;
        }
        
        .elemento-draggable.selected { border-color: #007bff; box-shadow: 0 0 10px rgba(0, 123, 255, 0.6); background: rgba(0, 123, 255, 0.15); z-index: 50; }

        .titulo-conducto { font-weight: bold; font-size: 13px; margin-bottom: 2px; color: #000; text-align: center; }
        .grid-tubos { display: grid; gap: 2px; justify-items: center; }
        
        .tubo-ind { width: 22px; height: 22px; border: 2px solid #2b4c7e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; background: transparent; color: #8b5a2b; }

        .texto-libre { font-size: 14px; font-weight: bold; color: #000; padding: 1px 3px; background: transparent; white-space: nowrap; }
        .texto-libre.cables-totales { color: #000; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <header>
        <h2 id="titulo-app">Cargando...</h2>
        <button id="btn-guardar">GUARDAR</button>
    </header>

    <div id="banner-estado"></div>

    <div id="contenedor-lienzo">
        <div id="lienzo"></div>
    </div>

    <div class="controles">
        <button id="btn-add-conducto">+ Conducto</button>
        <button id="btn-add-texto">+ Texto / Nota</button>
    </div>

    <div class="bloque-herramientas">
        <div class="fila-herramientas">
            <button id="btn-rotar-izq">↺ Girar</button>
            <button id="btn-zoom-in">➕ Zoom</button>
        </div>
        <div class="fila-herramientas">
            <button id="btn-rotar-der">↻ Girar</button>
            <button id="btn-zoom-out">➖ Zoom</button>
        </div>
        <div class="fila-herramientas">
            <button id="btn-multi">☐ Sel. Múltiple</button>
            <button id="btn-eliminar">🗑️ Borrar</button>
        </div>
    </div>

    <div class="seccion-cables">
        <button id="btn-toggle-cables">👁️ Ocultar (0,0)</button>
    </div>

    <div id="modal-opciones">
        <div class="modal-content">
            <h3>Seleccionar Conducto y Formato</h3>
            <div id="lista-conductos"></div>
            <div class="opcion-lista" style="color:#007bff; font-weight:bold;" onclick="abrirPersonalizado()">
                + Crear Personalizado...
            </div>
            <button onclick="cerrarModal()" style="width:100%; padding:15px; margin-top:15px; background:#6c757d; color:white; border:none; border-radius:8px; font-size:16px;">Cancelar</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => {
                console.log('Service Worker Registrado Exitosamente.');
            }).catch(err => console.error('Error al registrar SW:', err));
        }

        const urlScript = "https://script.google.com/macros/s/AKfycbzgetL9wcujKF9VIF5VsNPCytAi21s-EeFKPdt-kgpJFIxC7Jb_mku6YRbgE477VOty/exec"; 

        const urlParams = new URLSearchParams(window.location.search);
        let rawArqueta = urlParams.get('arqueta') || "SIN_ID";
        if (rawArqueta.includes(')')) {
            rawArqueta = rawArqueta.split(')').pop();
        }
        const arquetaId = rawArqueta.trim();

        document.getElementById('titulo-app').innerText = "Arqueta: " + arquetaId;

        let estadoLienzo = { id_arqueta: arquetaId, elementos: [], imagen_base64: "" };
        const lienzo = document.getElementById('lienzo');

        let elementosSeleccionados = new Set();
        let modoSeleccionMultiple = false;
        let cablesVisibles = true;

        const opcionesPredefinidas = [
            { prisma: 1, diametro: 110, cols: 1, label: "1 ø 110 (Horizontal)" },
            { prisma: 2, diametro: 110, cols: 2, label: "2 ø 110 (2x1 Horizontal)" },
            { prisma: 3, diametro: 110, cols: 3, label: "3 ø 110 (3x1 Horizontal)" },
            { prisma: 4, diametro: 110, cols: 4, label: "4 ø 110 (4x1 Horizontal)" },
            { prisma: 5, diametro: 110, cols: 5, label: "5 ø 110 (5x1 Horizontal)" },
            { prisma: 6, diametro: 110, cols: 6, label: "6 ø 110 (6x1 Horizontal)" },
            { prisma: 4, diametro: 110, cols: 2, label: "4 ø 110 (2 cols x 2 filas)" },
            { prisma: 6, diametro: 110, cols: 3, label: "6 ø 110 (3 cols x 2 filas)" },
            { prisma: 1, diametro: 125, cols: 1, label: "1 ø 125 (Horizontal)" },
            { prisma: 2, diametro: 125, cols: 2, label: "2 ø 125 (2x1 Horizontal)" },
            { prisma: 3, diametro: 125, cols: 3, label: "3 ø 125 (3x1 Horizontal)" },
            { prisma: 4, diametro: 125, cols: 4, label: "4 ø 125 (4x1 Horizontal)" },
            { prisma: 5, diametro: 125, cols: 5, label: "5 ø 125 (5x1 Horizontal)" },
            { prisma: 6, diametro: 125, cols: 6, label: "6 ø 125 (6x1 Horizontal)" },
            { prisma: 4, diametro: 125, cols: 2, label: "4 ø 125 (2 cols x 2 filas)" },
            { prisma: 6, diametro: 125, cols: 3, label: "6 ø 125 (3 cols x 2 filas)" }
        ];

        function inicializar() { 
            renderizarListaConductos(); 
            cargarDatosGuardados();
            sincronizarPendientesOffline();
        }

        const btnToggleCables = document.getElementById('btn-toggle-cables');
        btnToggleCables.addEventListener('click', () => {
            cablesVisibles = !cablesVisibles;
            const elementosCables = document.querySelectorAll('.elemento-draggable[data-tipo="cables"]');
            
            if (!cablesVisibles) {
                elementosCables.forEach(el => el.style.display = 'none');
                btnToggleCables.innerText = "👁️ Mostrar (0,0)";
                btnToggleCables.style.backgroundColor = "#6c757d";
                mostrarBanner("🙈 Se han ocultado los (0,0) en este abatimiento", "#6c757d");
            } else {
                if (elementosCables.length === 0) {
                    asegurarCablesTotalesCruz();
                } else {
                    elementosCables.forEach(el => el.style.display = 'flex');
                }
                btnToggleCables.innerText = "👁️ Ocultar (0,0)";
                btnToggleCables.style.backgroundColor = "#6f42c1";
                mostrarBanner("👁️ Visibles los (0,0)", "#6f42c1");
            }
        });

        function calcularCaraPorPosicion(x, y) {
            const rect = lienzo.getBoundingClientRect();
            const relX = x / (rect.width || 300);
            const relY = y / (rect.height || 300);

            if (relY < 0.35) return 'A';
            if (relY > 0.65) return 'C';
            if (relX > 0.60) return 'B';
            if (relX < 0.40) return 'D';
            return 'A';
        }

        function actualizarCaraDeElemento(el) {
            let x = parseFloat(el.getAttribute('data-x')) || 0;
            let y = parseFloat(el.getAttribute('data-y')) || 0;
            let caraAuto = calcularCaraPorPosicion(x, y);
            el.setAttribute('data-cara', caraAuto);
        }

        function cargarDatosGuardados() {
            if (arquetaId === "SIN_ID") {
                asegurarCablesTotalesCruz();
                return;
            }

            let localData = localStorage.getItem(`arqueta_${arquetaId}`);
            if (localData) {
                try {
                    let parsed = JSON.parse(localData);
                    if (parsed && parsed.elementos && parsed.elementos.length > 0) {
                        lienzo.innerHTML = "";
                        parsed.elementos.forEach(el => {
                            crearElementoEnDOM(el.tipo, el.texto, parseFloat(el.x), parseFloat(el.y), parseInt(el.prisma), el.diametro, parseFloat(el.rotacion), parseFloat(el.escala), parseInt(el.cols), el.cara);
                        });
                        seleccionarElemento(null);
                        mostrarBanner("📦 Cargado desde memoria offline del dispositivo", "#17a2b8");
                        return;
                    }
                } catch(e) {}
            }

            fetch(`${urlScript}?arqueta=${encodeURIComponent(arquetaId)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.elementos && data.elementos.length > 0) {
                        lienzo.innerHTML = "";
                        data.elementos.forEach(el => {
                            crearElementoEnDOM(el.tipo, el.texto, parseFloat(el.x), parseFloat(el.y), parseInt(el.prisma), el.diametro, parseFloat(el.rotacion), parseFloat(el.escala), parseInt(el.cols), el.cara);
                        });
                        seleccionarElemento(null);
                    } else {
                        asegurarCablesTotalesCruz();
                    }
                })
                .catch(err => {
                    console.error("Error al cargar datos:", err);
                    asegurarCablesTotalesCruz();
                });
        }

        function seleccionarElemento(el) {
            if (!el) {
                elementosSeleccionados.forEach(e => e.classList.remove('selected'));
                elementosSeleccionados.clear();
                return;
            }

            if (modoSeleccionMultiple) {
                if (elementosSeleccionados.has(el)) {
                    el.classList.remove('selected');
                    elementosSeleccionados.delete(el);
                } else {
                    el.classList.add('selected');
                    elementosSeleccionados.add(el);
                }
            } else {
                elementosSeleccionados.forEach(e => e.classList.remove('selected'));
                elementosSeleccionados.clear();
                el.classList.add('selected');
                elementosSeleccionados.add(el);
            }
        }

        lienzo.addEventListener('click', (e) => {
            if(e.target === lienzo) seleccionarElemento(null);
        });

        const btnMulti = document.getElementById('btn-multi');
        btnMulti.addEventListener('click', () => {
            modoSeleccionMultiple = !modoSeleccionMultiple;
            btnMulti.style.backgroundColor = modoSeleccionMultiple ? '#28a745' : '#6c757d';
            btnMulti.innerText = modoSeleccionMultiple ? '☑️ Sel. Múltiple' : '☐ Sel. Múltiple';
        });

        document.getElementById('btn-eliminar').addEventListener('click', () => {
            elementosSeleccionados.forEach(el => {
                el.remove();
            });
            elementosSeleccionados.clear();
        });

        function cambiarZoomManual(delta) {
            elementosSeleccionados.forEach(el => {
                let x = parseFloat(el.getAttribute('data-x')) || 0;
                let y = parseFloat(el.getAttribute('data-y')) || 0;
                let rot = el.getAttribute('data-rotacion') || 0;
                let scale = parseFloat(el.getAttribute('data-scale')) || 1;

                scale += delta;
                if (scale < 0.4) scale = 0.4;
                if (scale > 3) scale = 3;

                el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                el.setAttribute('data-scale', scale);
            });
        }

        function cambiarRotacionManual(grados) {
            elementosSeleccionados.forEach(el => {
                let x = parseFloat(el.getAttribute('data-x')) || 0;
                let y = parseFloat(el.getAttribute('data-y')) || 0;
                let rot = (parseFloat(el.getAttribute('data-rotacion')) || 0) + grados;
                let scale = parseFloat(el.getAttribute('data-scale')) || 1;

                el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                el.setAttribute('data-rotacion', rot);
            });
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => cambiarZoomManual(0.1));
        document.getElementById('btn-zoom-out').addEventListener('click', () => cambiarZoomManual(-0.1));
        document.getElementById('btn-rotar-izq').addEventListener('click', () => cambiarRotacionManual(-90));
        document.getElementById('btn-rotar-der').addEventListener('click', () => cambiarRotacionManual(90));

        // CARA D CORREGIDA A 0.185 (LA POSICIÓN QUE ESTABA PERFECTA)
        function asegurarCablesTotalesCruz() {
            const rect = lienzo.getBoundingClientRect();
            const w = rect.width || 300;
            const h = rect.height || 300;

            let posA = { x: w * 0.44, y: h * 0.095 };
            let posB = { x: w * 0.812, y: h * 0.50 };
            let posC = { x: w * 0.44, y: h * 0.875 };
            let posD = { x: w * 0.185, y: h * 0.50 }; // Restablecido a 0.185 para centrarlo en la Cara D

            crearElementoEnDOM('cables', '(0,0)', posA.x, posA.y, 0, 0, 0, 1, 0, 'A');
            crearElementoEnDOM('cables', '(0,0)', posB.x, posB.y, 0, 0, 90, 1, 0, 'B'); 
            crearElementoEnDOM('cables', '(0,0)', posC.x, posC.y, 0, 0, 0, 1, 0, 'C'); 
            crearElementoEnDOM('cables', '(0,0)', posD.x, posD.y, 0, 0, -90, 1, 0, 'D'); 

            seleccionarElemento(null);
        }

        function renderizarListaConductos() {
            let html = "";
            opcionesPredefinidas.forEach((opc, idx) => {
                html += `<div class="opcion-lista" onclick="seleccionarConductoPorIndice(${idx})">
                            <div class="opcion-info">○ ${opc.label}</div>
                            <span style="font-size:12px; color:#6c757d;">Elegir</span>
                         </div>`;
            });
            document.getElementById('lista-conductos').innerHTML = html;
        }

        document.getElementById('btn-add-conducto').addEventListener('click', () => { document.getElementById('modal-opciones').style.display = 'flex'; });
        function cerrarModal() { document.getElementById('modal-opciones').style.display = 'none'; }

        function seleccionarConductoPorIndice(idx) {
            cerrarModal();
            let opc = opcionesPredefinidas[idx];
            const rect = lienzo.getBoundingClientRect();
            let caraAuto = calcularCaraPorPosicion(rect.width/2 - 25, rect.height/2 - 25);
            crearElementoEnDOM('conducto', '', rect.width/2 - 25, rect.height/2 - 25, opc.prisma, opc.diametro, 0, 1, opc.cols, caraAuto);
        }

        function abrirPersonalizado() {
            cerrarModal();
            let p = prompt("Nº Total de Tubos (Prisma):");
            if (!p) return;
            let d = prompt("Diámetro:");
            if (!d) return;
            
            let orientacion = confirm("¿Quieres colocar los tubos en HORIZONTAL?\n\n- Pulsa ACEPTAR para Línea Horizontal (1 fila)\n- Pulsa CANCELAR para Línea Vertical (1 columna)");
            
            let cols = 1;
            if (orientacion) {
                cols = parseInt(p);
            } else {
                cols = 1;
            }

            const rect = lienzo.getBoundingClientRect();
            let caraAuto = calcularCaraPorPosicion(rect.width/2 - 25, rect.height/2 - 25);
            crearElementoEnDOM('conducto', '', rect.width/2 - 25, rect.height/2 - 25, parseInt(p), d, 0, 1, cols, caraAuto);
        }

        document.getElementById('btn-add-texto').addEventListener('click', () => {
            let texto = prompt("Escribe tu nota:");
            const rect = lienzo.getBoundingClientRect();
            let caraAuto = calcularCaraPorPosicion(rect.width/2 - 25, rect.height/2 - 25);
            if(texto) crearElementoEnDOM('texto', texto, rect.width/2 - 25, rect.height/2 - 25, 0, 0, 0, 1, 0, caraAuto);
        });

        function renderizarTubosInternos(div, prisma, diametro, cols) {
            prisma = parseInt(prisma);
            cols = parseInt(cols) || (prisma > 3 ? 2 : prisma);

            let filas = Math.ceil(prisma / cols);
            let inner = `<div class="titulo-conducto">${prisma} ø${diametro}</div>`;
            inner += `<div class="grid-tubos" style="grid-template-columns: repeat(${cols}, 1fr);">`;
            
            for (let r = filas - 1; r >= 0; r--) {
                for (let c = 0; c < cols; c++) {
                    let num = r * cols + c + 1;
                    if (num <= prisma) {
                        inner += `<div class="tubo-ind">${num}</div>`;
                    }
                }
            }
            
            inner += `</div>`;
            div.innerHTML = inner;
        }

        function crearElementoEnDOM(tipo, texto, x, y, prisma, diametro, rotacion, escala, cols, cara) {
            const div = document.createElement('div');
            div.className = 'elemento-draggable';
            div.setAttribute('data-x', x);
            div.setAttribute('data-y', y);
            div.setAttribute('data-tipo', tipo);
            div.setAttribute('data-prisma', prisma);
            div.setAttribute('data-diametro', diametro);
            div.setAttribute('data-rotacion', rotacion);
            div.setAttribute('data-scale', escala);
            div.setAttribute('data-cols', cols || 2);
            
            let caraCalculada = cara || calcularCaraPorPosicion(x, y);
            div.setAttribute('data-cara', caraCalculada);

            div.style.transform = `translate(${x}px, ${y}px) rotate(${rotacion}deg) scale(${escala})`;

            div.addEventListener('click', function(e) {
                seleccionarElemento(this);
                e.stopPropagation();
            });

            if(tipo === 'conducto') {
                renderizarTubosInternos(div, prisma, diametro, cols);

                div.addEventListener('dblclick', function(e) {
                    if (!elementosSeleccionados.has(this)) seleccionarElemento(this);
                    cambiarRotacionManual(90);
                });

            } else {
                let cl = tipo === 'cables' ? 'texto-libre cables-totales' : 'texto-libre';
                div.innerHTML = `<div class="${cl}">${texto}</div>`;
                
                div.addEventListener('dblclick', function(e) {
                    let actual = this.innerText;
                    let msg = tipo === 'cables' ? "Actualizar Cables Totales:" : "Editar nota:";
                    let nuevo = prompt(msg, actual);
                    if(nuevo !== null && nuevo.trim() !== "") this.querySelector('.texto-libre').innerText = nuevo;
                });
            }

            lienzo.appendChild(div);
            
            if (!modoSeleccionMultiple) {
                seleccionarElemento(div);
            } else {
                div.classList.add('selected');
                elementosSeleccionados.add(div);
            }
        }

        interact('.elemento-draggable')
            .draggable({
                inertia: true,
                modifiers: [ interact.modifiers.restrictRect({ restriction: 'parent', endOnly: true }) ],
                listeners: {
                    start(event) { 
                        if (!elementosSeleccionados.has(event.target)) seleccionarElemento(event.target); 
                    },
                    move (event) {
                        elementosSeleccionados.forEach(el => {
                            let x = (parseFloat(el.getAttribute('data-x')) || 0) + event.dx;
                            let y = (parseFloat(el.getAttribute('data-y')) || 0) + event.dy;
                            let rot = el.getAttribute('data-rotacion') || 0;
                            let scale = el.getAttribute('data-scale') || 1;
                            
                            el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                            el.setAttribute('data-x', x);
                            el.setAttribute('data-y', y);

                            actualizarCaraDeElemento(el);
                        });
                    }
                }
            })
            .gesturable({
                listeners: {
                    start(event) { 
                        if (!elementosSeleccionados.has(event.target)) seleccionarElemento(event.target); 
                    },
                    move (event) {
                        elementosSeleccionados.forEach(el => {
                            let x = parseFloat(el.getAttribute('data-x')) || 0;
                            let y = parseFloat(el.getAttribute('data-y')) || 0;
                            let rot = el.getAttribute('data-rotacion') || 0;
                            let scale = parseFloat(el.getAttribute('data-scale')) || 1;

                            scale += event.ds;
                            if (scale < 0.4) scale = 0.4;
                            if (scale > 3) scale = 3;

                            el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                            el.setAttribute('data-scale', scale);
                        });
                    }
                }
            });

        function mostrarBanner(mensaje, colorBg) {
            const banner = document.getElementById('banner-estado');
            banner.innerText = mensaje;
            banner.style.backgroundColor = colorBg;
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 4000);
        }

        document.getElementById('btn-guardar').addEventListener('click', () => {
            let btn = document.getElementById('btn-guardar');
            btn.innerText = "Capturando...";

            seleccionarElemento(null);

            html2canvas(lienzo, { useCORS: true, scale: 2 }).then(canvas => {
                let imagenBase64 = canvas.toDataURL("image/png");

                estadoLienzo.elementos = [];
                estadoLienzo.imagen_base64 = imagenBase64;

                document.querySelectorAll('.elemento-draggable').forEach(el => {
                    if (el.style.display !== 'none') {
                        estadoLienzo.elementos.push({
                            tipo: el.getAttribute('data-tipo'),
                            texto: el.innerText.split('\n')[0],
                            prisma: el.getAttribute('data-prisma'),
                            diametro: el.getAttribute('data-diametro'),
                            cols: el.getAttribute('data-cols'),
                            x: el.getAttribute('data-x'),
                            y: el.getAttribute('data-y'),
                            cara: el.getAttribute('data-cara') || 'A',
                            rotacion: el.getAttribute('data-rotacion'),
                            escala: el.getAttribute('data-scale')
                        });
                    }
                });

                localStorage.setItem(`arqueta_${arquetaId}`, JSON.stringify(estadoLienzo));

                btn.innerText = "Guardando...";

                if (!navigator.onLine) {
                    guardarEnColaOffline(estadoLienzo);
                    alert("⚠️ Sin conexión a internet. El abatimiento ha quedado guardado localmente en tu móvil. Se subirá a Google Sheets automáticamente al recuperar la cobertura.");
                    btn.innerText = "GUARDAR";
                    return;
                }

                fetch(urlScript, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(estadoLienzo)
                }).then(() => {
                    alert("¡Abatimiento guardado correctamente en Google Sheets!");
                    btn.innerText = "GUARDAR";
                }).catch(err => {
                    guardarEnColaOffline(estadoLienzo);
                    alert("⚠️ Error al conectar con el servidor. El abatimiento se guardó localmente en el móvil.");
                    btn.innerText = "GUARDAR";
                });
            });
        });

        function guardarEnColaOffline(datos) {
            let cola = JSON.parse(localStorage.getItem('cola_pendientes_arqueta') || '[]');
            cola = cola.filter(item => item.id_arqueta !== datos.id_arqueta);
            cola.push(datos);
            localStorage.setItem('cola_pendientes_arqueta', JSON.stringify(cola));
            mostrarBanner("⚠️ Guardado localmente sin conexión", "#ffc107");
        }

        function sincronizarPendientesOffline() {
            if (!navigator.onLine) return;

            let cola = JSON.parse(localStorage.getItem('cola_pendientes_arqueta') || '[]');
            if (cola.length === 0) return;

            mostrarBanner(`🔄 Sincronizando ${cola.length} abatimiento(s) pendiente(s)...`, "#17a2b8");

            let promesas = cola.map(datos => {
                return fetch(urlScript, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
            });

            Promise.all(promesas).then(() => {
                localStorage.removeItem('cola_pendientes_arqueta');
                mostrarBanner("✅ ¡Todos los abatimientos pendientes se han subido a Google Sheets!", "#28a745");
            }).catch(err => {
                console.error("Error al sincronizar cola offline:", err);
            });
        }

        window.addEventListener('online', sincronizarPendientesOffline);

        inicializar();
    </script>
</body>
</html>
