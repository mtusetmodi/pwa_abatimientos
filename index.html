<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abatimientos Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body { margin: 0; padding: 0; background-color: #e9ecef; overflow: hidden; }
        header { display: flex; justify-content: space-between; padding: 12px; background: #343a40; color: white; align-items: center; z-index: 10; position: relative;}
        header h2 { margin: 0; font-size: 18px; }
        header button { background: #495057; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold;}
        #btn-guardar { background: #28a745; }
        
        #lienzo {
            width: 100vw;
            height: 55vh;
            background-color: white;
            background-image: url('plantilla_cara1.png');
            background-size: contain;
            background-position: center top;
            background-repeat: no-repeat;
            position: relative;
            border-bottom: 2px solid #ccc;
            touch-action: none;
        }

        .controles { display: flex; justify-content: space-around; padding: 10px; background: #fff; }
        .controles button { padding: 12px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 8px; width: 45%; font-weight: bold;}
        
        .herramientas { display: flex; justify-content: center; gap: 15px; padding: 10px; background: #f8f9fa; border-top: 1px solid #ddd; }
        .herramientas button { padding: 10px 20px; font-size: 18px; background: #6c757d; color: white; border: none; border-radius: 8px; font-weight: bold; width: 40%;}
        .herramientas button:active { background: #5a6268; }

        #modal-opciones { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; }
        .modal-content { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 70vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; border-bottom: 2px solid #dc3545; padding-bottom: 10px; color: #dc3545; }
        .opcion-lista { padding: 15px; border-bottom: 1px solid #eee; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        
        .elemento-draggable {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            padding: 5px; background: rgba(255, 255, 255, 0.8); touch-action: none; cursor: grab;
            border-radius: 8px; border: 2px solid transparent;
        }
        
        .elemento-draggable.selected { border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.5); background: white; z-index: 50;}

        .titulo-conducto { font-weight: bold; font-size: 16px; margin-bottom: 3px; color: #000; text-align: center; }
        .grid-tubos { display: grid; gap: 2px; justify-items: center; }
        .tubo-ind { width: 28px; height: 28px; border: 2px solid #2b4c7e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; background: white; color: #8b5a2b; }

        .texto-libre { font-size: 18px; font-weight: bold; color: #000; padding: 4px 8px; }
        .texto-libre.cables-totales { color: #d32f2f; }
    </style>
</head>
<body>
    <header>
        <button id="btn-prev">←</button>
        <h2 id="titulo-cara">Cara 1 / 4</h2>
        <button id="btn-next">→</button>
        <button id="btn-guardar">GUARDAR</button>
    </header>

    <div id="lienzo"></div>

    <div class="controles">
        <button id="btn-add-conducto">+ Conducto</button>
        <button id="btn-add-texto">+ Texto / Nota</button>
    </div>

    <div class="herramientas">
        <button id="btn-zoom-out">➖ Zoom</button>
        <button id="btn-zoom-in">➕ Zoom</button>
    </div>

    <div id="modal-opciones">
        <div class="modal-content">
            <h3>Seleccionar Conducto</h3>
            <div id="lista-conductos"></div>
            <div class="opcion-lista" style="color:#007bff; font-weight:bold;" onclick="abrirPersonalizado()">
                + Crear Personalizado...
            </div>
            <button onclick="cerrarModal()" style="width:100%; padding:15px; margin-top:15px; background:#6c757d; color:white; border:none; border-radius:8px; font-size:16px;">Cancelar</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const arquetaId = urlParams.get('arqueta') || "SIN_ID";
        let estadoLienzo = { id_arqueta: arquetaId, caras: { 1: [], 2: [], 3: [], 4: [] } };
        let caraActual = 1;
        let elementoSeleccionado = null;
        const lienzo = document.getElementById('lienzo');

        const opcionesPredefinidas = [
            { prisma: 1, diametro: 110 }, { prisma: 2, diametro: 110 }, { prisma: 4, diametro: 110 }, { prisma: 6, diametro: 110 },
            { prisma: 1, diametro: 125 }, { prisma: 2, diametro: 125 }, { prisma: 4, diametro: 125 }, { prisma: 6, diametro: 125 },
            { prisma: 2, diametro: 100 }, { prisma: 5, diametro: 200 }
        ];

        function inicializar() { renderizarListaConductos(); actualizarVistaCara(); }

        function seleccionarElemento(el) {
            if(elementoSeleccionado) elementoSeleccionado.classList.remove('selected');
            elementoSeleccionado = el;
            if(el) el.classList.add('selected');
        }

        lienzo.addEventListener('click', (e) => {
            if(e.target === lienzo) seleccionarElemento(null);
        });

        function cambiarZoomManual(delta) {
            if(!elementoSeleccionado) return;
            let el = elementoSeleccionado;
            let x = parseFloat(el.getAttribute('data-x')) || 0;
            let y = parseFloat(el.getAttribute('data-y')) || 0;
            let rot = el.getAttribute('data-rotacion') || 0;
            let scale = parseFloat(el.getAttribute('data-scale')) || 1;

            scale += delta;
            if (scale < 0.4) scale = 0.4;
            if (scale > 3) scale = 3;

            el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
            el.setAttribute('data-scale', scale);
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => cambiarZoomManual(0.1));
        document.getElementById('btn-zoom-out').addEventListener('click', () => cambiarZoomManual(-0.1));

        function actualizarVistaCara() {
            seleccionarElemento(null);
            document.getElementById('titulo-cara').innerText = `Cara ${caraActual} / 4`;
            lienzo.style.backgroundImage = `url('plantilla_cara${caraActual}.png')`;
            
            document.querySelectorAll('.elemento-draggable').forEach(el => {
                el.style.display = (parseInt(el.getAttribute('data-cara')) === caraActual) ? 'flex' : 'none';
            });
            asegurarCablesTotales();
        }

        document.getElementById('btn-prev').addEventListener('click', () => { if (caraActual > 1) { caraActual--; actualizarVistaCara(); } });
        document.getElementById('btn-next').addEventListener('click', () => { if (caraActual < 4) { caraActual++; actualizarVistaCara(); } });

        function asegurarCablesTotales() {
            if(!document.querySelector(`.elemento-draggable[data-cara="${caraActual}"][data-tipo="cables"]`)) {
                crearElementoEnDOM('cables', '(0,0)', 50, 20, 0, 0, 0, 1);
            }
        }

        function renderizarListaConductos() {
            let html = "";
            opcionesPredefinidas.forEach(opc => {
                html += `<div class="opcion-lista" onclick="seleccionarConducto(${opc.prisma}, ${opc.diametro})">
                            <div class="circulo-ico"></div> ${opc.prisma} ø ${opc.diametro}
                         </div>`;
            });
            document.getElementById('lista-conductos').innerHTML = html;
        }

        document.getElementById('btn-add-conducto').addEventListener('click', () => { document.getElementById('modal-opciones').style.display = 'flex'; });
        function cerrarModal() { document.getElementById('modal-opciones').style.display = 'none'; }

        function seleccionarConducto(prisma, diametro) { cerrarModal(); crearElementoEnDOM('conducto', '', 100, 100, prisma, diametro, 0, 1); }

        function abrirPersonalizado() {
            cerrarModal();
            let p = prompt("Nº de Tubos (Prisma):");
            let d = prompt("Diámetro:");
            if(p && d) seleccionarConducto(p, d);
        }

        document.getElementById('btn-add-texto').addEventListener('click', () => {
            let texto = prompt("Escribe tu nota:");
            if(texto) crearElementoEnDOM('texto', texto, 100, 100, 0, 0, 0, 1);
        });

        function crearElementoEnDOM(tipo, texto, x, y, prisma, diametro, rotacion, escala) {
            const div = document.createElement('div');
            div.className = 'elemento-draggable';
            div.setAttribute('data-x', x);
            div.setAttribute('data-y', y);
            div.setAttribute('data-tipo', tipo);
            div.setAttribute('data-prisma', prisma);
            div.setAttribute('data-diametro', diametro);
            div.setAttribute('data-cara', caraActual);
            div.setAttribute('data-rotacion', rotacion);
            div.setAttribute('data-scale', escala);

            div.style.transform = `translate(${x}px, ${y}px) rotate(${rotacion}deg) scale(${escala})`;

            div.addEventListener('click', function(e) {
                seleccionarElemento(this);
                e.stopPropagation();
            });

            if(tipo === 'conducto') {
                let cols = prisma > 3 ? 2 : prisma; 
                if (prisma == 6) cols = 2; 
                
                let inner = `<div class="titulo-conducto">${prisma} ø${diametro}</div>`;
                inner += `<div class="grid-tubos" style="grid-template-columns: repeat(${cols}, 1fr);">`;
                for(let i=1; i<=prisma; i++) inner += `<div class="tubo-ind">${i}</div>`;
                inner += `</div>`;
                div.innerHTML = inner;

                div.addEventListener('dblclick', function(e) {
                    let rot = parseInt(this.getAttribute('data-rotacion')) === 0 ? -90 : 0;
                    this.setAttribute('data-rotacion', rot);
                    let curX = this.getAttribute('data-x');
                    let curY = this.getAttribute('data-y');
                    let curScale = this.getAttribute('data-scale');
                    this.style.transform = `translate(${curX}px, ${curY}px) rotate(${rot}deg) scale(${curScale})`;
                });

            } else {
                let cl = tipo === 'cables' ? 'texto-libre cables-totales' : 'texto-libre';
                div.innerHTML = `<div class="${cl}">${texto}</div>`;
                
                div.addEventListener('dblclick', function(e) {
                    let actual = this.innerText;
                    let msg = tipo === 'cables' ? "Actualizar Cables Totales:" : "Editar nota:";
                    let nuevo = prompt(msg, actual);
                    if(nuevo !== null && nuevo.trim() !== "") this.querySelector('.texto-libre').innerText = nuevo;
                });
            }
            lienzo.appendChild(div);
            seleccionarElemento(div);
        }

        interact('.elemento-draggable')
            .draggable({
                inertia: true,
                modifiers: [ interact.modifiers.restrictRect({ restriction: 'parent', endOnly: true }) ],
                listeners: {
                    start(event) { seleccionarElemento(event.target); },
                    move (event) {
                        let target = event.target;
                        let x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                        let y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                        let rot = target.getAttribute('data-rotacion') || 0;
                        let scale = target.getAttribute('data-scale') || 1;
                        
                        target.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                        target.setAttribute('data-x', x);
                        target.setAttribute('data-y', y);
                    }
                }
            })
            .gesturable({
                listeners: {
                    start(event) { seleccionarElemento(event.target); },
                    move (event) {
                        let target = event.target;
                        let x = parseFloat(target.getAttribute('data-x')) || 0;
                        let y = parseFloat(target.getAttribute('data-y')) || 0;
                        let rot = target.getAttribute('data-rotacion') || 0;
                        let scale = parseFloat(target.getAttribute('data-scale')) || 1;

                        scale += event.ds;
                        if (scale < 0.4) scale = 0.4;
                        if (scale > 3) scale = 3;

                        target.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                        target.setAttribute('data-scale', scale);
                    }
                }
            });

        document.getElementById('btn-guardar').addEventListener('click', () => {
            const urlScript = "https://script.google.com/macros/s/AKfycbxV_e2__0A4icbrya5ErahfhCyNB4VWcRysKVubANKWZj83kgav2aGNIovUOejmzHL7/exec"; 

            for(let i=1; i<=4; i++) estadoLienzo.caras[i] = [];

            document.querySelectorAll('.elemento-draggable').forEach(el => {
                let c = parseInt(el.getAttribute('data-cara'));
                estadoLienzo.caras[c].push({
                    tipo: el.getAttribute('data-tipo'),
                    texto: el.innerText.split('\n')[0],
                    prisma: el.getAttribute('data-prisma'),
                    diametro: el.getAttribute('data-diametro'),
                    x: el.getAttribute('data-x'),
                    y: el.getAttribute('data-y'),
                    rotacion: el.getAttribute('data-rotacion'),
                    escala: el.getAttribute('data-scale')
                });
            });

            let btn = document.getElementById('btn-guardar');
            btn.innerText = "Guardando...";

            fetch(urlScript, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(estadoLienzo)
            }).then(() => {
                alert("¡Abatimiento guardado correctamente!");
                btn.innerText = "GUARDAR";
            }).catch(err => {
                alert("Error de conexión al guardar.");
                btn.innerText = "GUARDAR";
            });
        });

        inicializar();
    </script>
</body>
</html>
