<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abatimiento Completo</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#343a40">

    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body { margin: 0; padding: 0; background-color: #e9ecef; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; display: flex; justify-content: space-between; padding: 12px 16px; background: #343a40; color: white; align-items: center; z-index: 10; position: relative;}
        header h2 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
        #btn-guardar { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 15px; cursor: pointer;}
        
        #banner-estado {
            width: 100%; max-width: 500px; padding: 6px; text-align: center; font-size: 12px; font-weight: bold;
            display: none; color: white; transition: all 0.3s ease; z-index: 20;
        }

        #contenedor-lienzo {
            width: 100vw;
            max-width: 420px;
            height: 48vh;
            max-height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            position: relative;
        }

        #lienzo {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            max-width: 100%;
            max-height: 100%;
            background-color: white;
            background-image: url('plantilla_cruz.png');
            background-size: 100% 100%;
            background-position: center center;
            background-repeat: no-repeat;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }

        .controles { width: 100%; max-width: 420px; display: flex; justify-content: space-between; gap: 4px; padding: 6px 8px; background: #fff; }
        .controles button { padding: 9px 4px; font-size: 11px; background: #007bff; color: white; border: none; border-radius: 8px; flex: 1; font-weight: bold; cursor: pointer; text-align: center;}

        .bloque-herramientas {
            width: 100%; max-width: 420px; background: #f8f9fa; border-top: 1px solid #ddd; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px;
        }
        
        .fila-herramientas { display: flex; justify-content: space-between; width: 100%; gap: 10px; }
        .fila-herramientas button { flex: 1; padding: 8px 2px; font-size: 12px; font-weight: bold; border: none; border-radius: 8px; color: white; background: #6c757d; text-align: center; cursor: pointer; }
        #btn-eliminar { background: #dc3545; } 
        
        .seccion-cables { width: 100%; max-width: 420px; background: #e9ecef; border-top: 2px solid #ced4da; padding: 6px; display: flex; justify-content: center; }
        #btn-toggle-cables { width: 100%; padding: 10px; font-size: 13px; font-weight: bold; border: none; border-radius: 8px; color: white; background: #6f42c1; text-align: center; cursor: pointer; }

        #modal-opciones { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; justify-content: center; }
        .modal-content { background: white; width: 100%; max-width: 420px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; text-align: center;}
        .modal-content h3 { margin-top: 0; border-bottom: 2px solid #dc3545; padding-bottom: 10px; color: #dc3545; }
        .opcion-lista { padding: 15px; border-bottom: 1px solid #eee; font-size: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;}

        .elemento-draggable {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            padding: 2px; background: transparent; touch-action: none; cursor: grab;
            border-radius: 6px; border: 2px solid transparent;
        }
        .elemento-draggable.selected { border-color: #007bff; box-shadow: 0 0 10px rgba(0, 123, 255, 0.6); background: rgba(0, 123, 255, 0.15); z-index: 50; }

        .titulo-conducto { font-weight: bold; font-size: 13px; margin-bottom: 2px; color: #000; text-align: center; }
        .grid-tubos { display: grid; gap: 2px; justify-items: center; }
        .tubo-ind { width: 22px; height: 22px; border: 2px solid #2b4c7e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; background: transparent; color: #8b5a2b; }

        .texto-libre { font-size: 14px; font-weight: bold; color: #000; padding: 1px 3px; background: transparent; white-space: nowrap; }
        .texto-libre.cables-totales { color: #000; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <header>
        <h2 id="titulo-app">Cargando...</h2>
        <button id="btn-guardar">GUARDAR</button>
    </header>

    <div id="banner-estado"></div>

    <div id="contenedor-lienzo">
        <div id="lienzo"></div>
    </div>

    <div class="controles">
        <button id="btn-add-conducto">+ Conducto</button>
        <button id="btn-add-texto">+ Texto</button>
    </div>

    <div class="bloque-herramientas">
        <div class="fila-herramientas">
            <button id="btn-rotar-izq">↺ Girar</button>
            <button id="btn-zoom-in">➕ Zoom</button>
        </div>
        <div class="fila-herramientas">
            <button id="btn-rotar-der">↻ Girar</button>
            <button id="btn-zoom-out">➖ Zoom</button>
        </div>
        <div class="fila-herramientas">
            <button id="btn-multi">☐ Sel. Múltiple</button>
            <button id="btn-eliminar">🗑️ Borrar</button>
        </div>
    </div>

    <div class="seccion-cables">
        <button id="btn-toggle-cables">👁️ Ocultar (0,0)</button>
    </div>

    <div id="modal-opciones">
        <div class="modal-content">
            <h3>Seleccionar Conducto</h3>
            <div id="lista-conductos"></div>
            <div class="opcion-lista" style="color:#007bff; font-weight:bold;" onclick="abrirPersonalizado()">+ Crear Personalizado...</div>
            <button onclick="cerrarModal()" style="width:100%; padding:15px; margin-top:15px; background:#6c757d; color:white; border-radius:8px;">Cancelar</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
        }

        const urlScript = "https://script.google.com/macros/s/AKfycbxwwuGB0KT-s1ntqKDaWvIn__W5jJxCCpY2NqdUvtwb-6WXMNMFY9RjQIPoTpHC85Lh/exec"; 

        const urlParams = new URLSearchParams(window.location.search);
        let rawArqueta = urlParams.get('arqueta') || "SIN_ID";
        if (rawArqueta.includes(')')) rawArqueta = rawArqueta.split(')').pop();
        const arquetaId = rawArqueta.trim();

        const fotosAppSheet = {
            A: urlParams.get('fotoA'),
            B: urlParams.get('fotoB'),
            C: urlParams.get('fotoC'),
            D: urlParams.get('fotoD')
        };

        document.getElementById('titulo-app').innerText = "Arqueta: " + arquetaId;
        let estadoLienzo = { id_arqueta: arquetaId, elementos: [], imagen_base64: "" };
        const lienzo = document.getElementById('lienzo');

        let elementosSeleccionados = new Set();
        let modoSeleccionMultiple = false;
        let cablesVisibles = true;

        const opcionesPredefinidas = [
            { prisma: 1, diametro: 110, cols: 1, label: "1 ø 110" },
            { prisma: 2, diametro: 110, cols: 2, label: "2 ø 110" },
            { prisma: 3, diametro: 110, cols: 3, label: "3 ø 110" },
            { prisma: 4, diametro: 110, cols: 4, label: "4 ø 110" },
            { prisma: 1, diametro: 125, cols: 1, label: "1 ø 125" },
            { prisma: 2, diametro: 125, cols: 2, label: "2 ø 125" }
        ];

        function inicializar() { 
            renderizarListaConductos(); 
            cargarOAutoGenerar();
        }

        function cargarOAutoGenerar() {
            mostrarBanner("⏳ Cargando esquema...", "#6f42c1");

            let urlConsulta = `${urlScript}?arqueta=${encodeURIComponent(arquetaId)}&fotoA=${encodeURIComponent(fotosAppSheet.A || '')}&fotoB=${encodeURIComponent(fotosAppSheet.B || '')}&fotoC=${encodeURIComponent(fotosAppSheet.C || '')}&fotoD=${encodeURIComponent(fotosAppSheet.D || '')}`;

            fetch(urlConsulta)
                .then(r => r.json())
                .then(data => {
                    lienzo.innerHTML = "";
                    if (data && data.elementos && data.elementos.length > 0) {
                        data.elementos.forEach(el => {
                            crearElementoEnDOM(el.tipo, el.texto, parseFloat(el.x), parseFloat(el.y), parseInt(el.prisma), el.diametro, parseFloat(el.rotacion), parseFloat(el.escala), parseInt(el.cols), el.cara);
                        });
                        mostrarBanner("✅ Esquema listo", "#28a745");
                    } else {
                        asegurarCablesTotalesCruz();
                        mostrarBanner("✨ Listo para editar", "#17a2b8");
                    }
                    seleccionarElemento(null);
                })
                .catch(err => {
                    asegurarCablesTotalesCruz();
                });
        }

        function seleccionarElemento(el) {
            if (!el) {
                elementosSeleccionados.forEach(e => e.classList.remove('selected'));
                elementosSeleccionados.clear();
                return;
            }
            if (modoSeleccionMultiple) {
                if (elementosSeleccionados.has(el)) {
                    el.classList.remove('selected');
                    elementosSeleccionados.delete(el);
                } else {
                    el.classList.add('selected');
                    elementosSeleccionados.add(el);
                }
            } else {
                elementosSeleccionados.forEach(e => e.classList.remove('selected'));
                elementosSeleccionados.clear();
                el.classList.add('selected');
                elementosSeleccionados.add(el);
            }
        }

        lienzo.addEventListener('click', (e) => { if(e.target === lienzo) seleccionarElemento(null); });

        const btnMulti = document.getElementById('btn-multi');
        btnMulti.addEventListener('click', () => {
            modoSeleccionMultiple = !modoSeleccionMultiple;
            btnMulti.style.backgroundColor = modoSeleccionMultiple ? '#28a745' : '#6c757d';
            btnMulti.innerText = modoSeleccionMultiple ? '☑️ Sel. Múltiple' : '☐ Sel. Múltiple';
        });

        document.getElementById('btn-eliminar').addEventListener('click', () => {
            elementosSeleccionados.forEach(el => el.remove());
            elementosSeleccionados.clear();
        });

        function cambiarZoomManual(delta) {
            elementosSeleccionados.forEach(el => {
                let x = parseFloat(el.getAttribute('data-x')) || 0;
                let y = parseFloat(el.getAttribute('data-y')) || 0;
                let rot = el.getAttribute('data-rotacion') || 0;
                let scale = (parseFloat(el.getAttribute('data-scale')) || 1) + delta;
                if (scale < 0.4) scale = 0.4;
                if (scale > 3) scale = 3;
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                el.setAttribute('data-scale', scale);
            });
        }

        function cambiarRotacionManual(grados) {
            elementosSeleccionados.forEach(el => {
                let x = parseFloat(el.getAttribute('data-x')) || 0;
                let y = parseFloat(el.getAttribute('data-y')) || 0;
                let rot = (parseFloat(el.getAttribute('data-rotacion')) || 0) + grados;
                let scale = parseFloat(el.getAttribute('data-scale')) || 1;
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                el.setAttribute('data-rotacion', rot);
            });
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => cambiarZoomManual(0.1));
        document.getElementById('btn-zoom-out').addEventListener('click', () => cambiarZoomManual(-0.1));
        document.getElementById('btn-rotar-izq').addEventListener('click', () => cambiarRotacionManual(-90));
        document.getElementById('btn-rotar-der').addEventListener('click', () => cambiarRotacionManual(90));

        function asegurarCablesTotalesCruz() {
            const rect = lienzo.getBoundingClientRect();
            const w = rect.width || 300;
            const h = rect.height || 300;
            crearElementoEnDOM('cables', '(0,0)', w * 0.44, h * 0.095, 0, 0, 0, 1, 0, 'A');
            crearElementoEnDOM('cables', '(0,0)', w * 0.830, h * 0.50, 0, 0, 90, 1, 0, 'B'); 
            crearElementoEnDOM('cables', '(0,0)', w * 0.44, h * 0.875, 0, 0, 0, 1, 0, 'C'); 
            crearElementoEnDOM('cables', '(0,0)', w * 0.060, h * 0.50, 0, 0, -90, 1, 0, 'D'); 
            seleccionarElemento(null);
        }

        function renderizarListaConductos() {
            let html = "";
            opcionesPredefinidas.forEach((opc, idx) => {
                html += `<div class="opcion-lista" onclick="seleccionarConductoPorIndice(${idx})">
                            <div>○ ${opc.label}</div>
                            <span style="font-size:12px; color:#6c757d;">Elegir</span>
                         </div>`;
            });
            document.getElementById('lista-conductos').innerHTML = html;
        }

        document.getElementById('btn-add-conducto').addEventListener('click', () => { document.getElementById('modal-opciones').style.display = 'flex'; });
        function cerrarModal() { document.getElementById('modal-opciones').style.display = 'none'; }

        function seleccionarConductoPorIndice(idx) {
            cerrarModal();
            let opc = opcionesPredefinidas[idx];
            const rect = lienzo.getBoundingClientRect();
            crearElementoEnDOM('conducto', '', rect.width/2 - 25, rect.height/2 - 25, opc.prisma, opc.diametro, 0, 1, opc.cols, 'A');
        }

        function abrirPersonalizado() {
            cerrarModal();
            let p = prompt("Nº Total de Tubos (Prisma):");
            if (!p) return;
            let d = prompt("Diámetro:");
            if (!d) return;
            const rect = lienzo.getBoundingClientRect();
            crearElementoEnDOM('conducto', '', rect.width/2 - 25, rect.height/2 - 25, parseInt(p), d, 0, 1, parseInt(p), 'A');
        }

        document.getElementById('btn-add-texto').addEventListener('click', () => {
            let texto = prompt("Escribe tu nota:");
            const rect = lienzo.getBoundingClientRect();
            if(texto) crearElementoEnDOM('texto', texto, rect.width/2 - 25, rect.height/2 - 25, 0, 0, 0, 1, 0, 'A');
        });

        function renderizarTubosInternos(div, prisma, diametro, cols) {
            prisma = parseInt(prisma);
            cols = parseInt(cols) || (prisma > 3 ? 2 : prisma);
            let filas = Math.ceil(prisma / cols);
            let inner = `<div class="titulo-conducto">${prisma} ø${diametro}</div><div class="grid-tubos" style="grid-template-columns: repeat(${cols}, 1fr);">`;
            for (let r = filas - 1; r >= 0; r--) {
                for (let c = 0; c < cols; c++) {
                    let num = r * cols + c + 1;
                    if (num <= prisma) inner += `<div class="tubo-ind">${num}</div>`;
                }
            }
            inner += `</div>`;
            div.innerHTML = inner;
        }

        function crearElementoEnDOM(tipo, texto, x, y, prisma, diametro, rotacion, escala, cols, cara) {
            const div = document.createElement('div');
            div.className = 'elemento-draggable';
            div.setAttribute('data-x', x);
            div.setAttribute('data-y', y);
            div.setAttribute('data-tipo', tipo);
            div.setAttribute('data-prisma', prisma);
            div.setAttribute('data-diametro', diametro);
            div.setAttribute('data-rotacion', rotacion);
            div.setAttribute('data-scale', escala);
            div.setAttribute('data-cols', cols || 2);
            div.setAttribute('data-cara', cara || 'A');

            div.style.transform = `translate(${x}px, ${y}px) rotate(${rotacion}deg) scale(${escala})`;
            div.addEventListener('click', function(e) { seleccionarElemento(this); e.stopPropagation(); });

            if(tipo === 'conducto') {
                renderizarTubosInternos(div, prisma, diametro, cols);
                div.addEventListener('dblclick', function() { cambiarRotacionManual(90); });
            } else {
                let cl = tipo === 'cables' ? 'texto-libre cables-totales' : 'texto-libre';
                div.innerHTML = `<div class="${cl}">${texto}</div>`;
                div.addEventListener('dblclick', function() {
                    let nuevo = prompt("Editar nota:", this.innerText);
                    if(nuevo) this.querySelector('.texto-libre').innerText = nuevo;
                });
            }

            lienzo.appendChild(div);
            seleccionarElemento(div);
        }

        interact('.elemento-draggable').draggable({
            inertia: true,
            modifiers: [ interact.modifiers.restrictRect({ restriction: 'parent', endOnly: true }) ],
            listeners: {
                start(event) { if (!elementosSeleccionados.has(event.target)) seleccionarElemento(event.target); },
                move (event) {
                    elementosSeleccionados.forEach(el => {
                        let x = (parseFloat(el.getAttribute('data-x')) || 0) + event.dx;
                        let y = (parseFloat(el.getAttribute('data-y')) || 0) + event.dy;
                        let rot = el.getAttribute('data-rotacion') || 0;
                        let scale = el.getAttribute('data-scale') || 1;
                        el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
                        el.setAttribute('data-x', x);
                        el.setAttribute('data-y', y);
                    });
                }
            }
        });

        function mostrarBanner(mensaje, colorBg) {
            const banner = document.getElementById('banner-estado');
            banner.innerText = mensaje;
            banner.style.backgroundColor = colorBg;
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 4000);
        }

        document.getElementById('btn-guardar').addEventListener('click', () => {
            let btn = document.getElementById('btn-guardar');
            btn.innerText = "Guardando...";
            seleccionarElemento(null);

            html2canvas(lienzo, { useCORS: true, scale: 2 }).then(canvas => {
                estadoLienzo.elementos = [];
                estadoLienzo.imagen_base64 = canvas.toDataURL("image/png");

                document.querySelectorAll('.elemento-draggable').forEach(el => {
                    if (el.style.display !== 'none') {
                        estadoLienzo.elementos.push({
                            tipo: el.getAttribute('data-tipo'),
                            texto: el.innerText.split('\n')[0],
                            prisma: el.getAttribute('data-prisma'),
                            diametro: el.getAttribute('data-diametro'),
                            cols: el.getAttribute('data-cols'),
                            x: el.getAttribute('data-x'),
                            y: el.getAttribute('data-y'),
                            cara: el.getAttribute('data-cara') || 'A',
                            rotacion: el.getAttribute('data-rotacion'),
                            escala: el.getAttribute('data-scale')
                        });
                    }
                });

                fetch(urlScript, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(estadoLienzo)
                }).then(() => {
                    alert("¡Abatimiento guardado en Google Sheets!");
                    btn.innerText = "GUARDAR";
                }).catch(() => {
                    alert("⚠️ Error al guardar.");
                    btn.innerText = "GUARDAR";
                });
            });
        });

        inicializar();
    </script>
</body>
</html>
